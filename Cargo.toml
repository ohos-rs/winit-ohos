[package]
name = "winit-ohos"
version = "0.31.0-beta.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohos-rs/winit-ohos.git"
description = "Winit's OpenHarmony backend"

[features]
default = []
plugin-window = ["dep:openharmony-ability-plugin-window"]

[dependencies]
winit-core = "=0.31.0-beta.3"
tracing = { version = "0.1.40", default-features = false }
dpi = "=0.1.2"
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }

openharmony-ability = { version = "1.0.0-beta.2" }
openharmony-ability-derive = { version = "1.0.0-beta.1" }
openharmony-ability-plugin-window = { version = "1.0.0-beta.1", optional = true }
