[package]
name = "winit-ohos"
version = "0.31.0-beta.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohos-rs/winit-ohos.git"
description = "Winit's OpenHarmony backend"

[features]
default = []
plugin-window = []
extended-plugins = ["dep:openharmony-ability-plugin-menu", "dep:openharmony-ability-plugin-notification", "dep:openharmony-ability-plugin-process", "dep:openharmony-ability-plugin-system-state", "dep:openharmony-ability-plugin-accessibility", "dep:crossbeam-channel"]

[dependencies]
winit-core = { version = "=0.31.0-beta.3", git = "https://github.com/richerfu/winit.git", rev = "c9ee2bff8a79aacb8068546e7150197693d35a5a" }
tracing = { version = "0.1.40", default-features = false, features = ["log"] }
dpi = { version = "=0.1.2", git = "https://github.com/richerfu/winit.git", rev = "c9ee2bff8a79aacb8068546e7150197693d35a5a" }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }

openharmony-ability = { version = "1.0.0-beta.2", features = ["keyboard", "mouse", "drag", "stylus"], git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-derive = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-window = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }

futures-executor = { version = "0.3", features = ["thread-pool"] }
futures-channel = "0.3"
ohos-fileuri-binding = "0.1"
ohos-fileshare-binding = "0.2.4"
openharmony-ability-plugin-clipboard = { version = "1.0.0-beta.0", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-url = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-files = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-app-control = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
ohos-window-manager-binding = { version = "0.1.1", features = ["api-22"] }

ohos-display-sys = { version = "0.1.4", features = ["api-14"] }

openharmony-ability-plugin-permission = { version = "1.0.0-beta.1", git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }

crossbeam-channel = { version = "0.5", optional = true }
openharmony-ability-plugin-menu = { version = "1.0.0-beta.0", optional = true, git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-notification = { version = "1.0.0-beta.0", optional = true, git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-process = { version = "1.0.0-beta.0", optional = true, git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-system-state = { version = "1.0.0-beta.0", optional = true, git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
openharmony-ability-plugin-accessibility = { version = "1.0.0-beta.0", optional = true, git = "https://github.com/richerfu/openharmony-ability.git", rev = "eab9d11ad00ab8ab85aff5e5c3cfa86cdd6fb5bb" }
